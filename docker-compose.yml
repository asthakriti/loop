services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: loop
      POSTGRES_PASSWORD: loop
      POSTGRES_DB: loop
    ports:
      # 5433 on your machine, so it does not clash with a locally installed Postgres.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loop -d loop"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Same production image as Render. On start it updates the tables and loads the bank and bytes.
    build: ./backend
    environment:
      # Inside docker, the database host is the service name "db".
      DATABASE_URL: postgresql+psycopg://loop:loop@db:5432/loop
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
