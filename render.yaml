# Render Blueprint: creates the Postgres database and the Loop API in one go.
# Render dashboard -> New -> Blueprint -> pick this repo.

databases:
  - name: loop-db
    plan: free
    databaseName: loop
    user: loop
    postgresMajorVersion: "16"

services:
  - type: web
    name: loop-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: loop-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render makes a long random secret
      - key: JWT_EXPIRE_MINUTES
        value: "1440" # stay logged in for one day
      - key: CORS_ORIGINS
        sync: false # you type your Vercel address here, e.g. https://loop-xyz.vercel.app
